terminal_states:
  - COMPLETED
  - BLOCKED
  - FAILED
  - ROLLED_BACK
transitions:
  INITIALIZING: [READY, BLOCKED, FAILED, BREAK_GLASS]
  READY: [ROUTED, BLOCKED, FAILED, BREAK_GLASS]
  ROUTED: [EXECUTING, BLOCKED, FAILED, BREAK_GLASS]
  EXECUTING: [VALIDATING, BLOCKED, FAILED, BREAK_GLASS]
  VALIDATING: [CURATING, BLOCKED, FAILED, BREAK_GLASS]
  CURATING: [COMMITTING, BLOCKED, FAILED, BREAK_GLASS]
  COMMITTING: [SYNCING, PENDING_SYNC, FAILED, BREAK_GLASS]
  SYNCING: [COMPLETED, PARTIAL_SYNC, PENDING_SYNC, FAILED, BREAK_GLASS]
  PENDING_SYNC: [RETRYING_SYNC, BLOCKED, FAILED, BREAK_GLASS]
  PARTIAL_SYNC: [RETRYING_SYNC, BLOCKED, FAILED, BREAK_GLASS]
  RETRYING_SYNC: [SYNCING, PENDING_SYNC, PARTIAL_SYNC, FAILED, BREAK_GLASS]
  BREAK_GLASS: [READY, EXECUTING, VALIDATING, CURATING, COMMITTING, SYNCING, BLOCKED, FAILED]
  COMPLETED: []
  BLOCKED: []
  FAILED: []
  ROLLED_BACK: []
