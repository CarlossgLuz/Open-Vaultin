[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vaultin"
version = "0.1.0"
description = "Codex-first multi-AI governance and knowledge control plane"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2,<3",
  "PyYAML>=6,<7",
  "typer>=0.12,<1",
  "filelock>=3.13,<5",
  "httpx>=0.27,<1",
  "mcp>=2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8"]

[project.scripts]
vaultinctl = "vaultin.cli:app"
vaultinctl-hook = "vaultin.hooks.entrypoint:main"
vaultin-mcp = "vaultin.mcp.server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
