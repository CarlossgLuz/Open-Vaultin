[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vaultin"
version = "0.1.0"
description = "Local-first governance and durable-knowledge layer for AI-assisted software engineering"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "Carlos Gabriel" }
]
keywords = [
  "ai",
  "agents",
  "codex",
  "governance",
  "mcp",
  "devtools",
  "software-engineering",
  "knowledge-management"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Software Development",
  "Topic :: Software Development :: Quality Assurance"
]
dependencies = [
  "pydantic>=2,<3",
  "PyYAML>=6,<7",
  "typer>=0.12,<1",
  "filelock>=3.13,<4",
  "httpx>=0.27,<1",
  "mcp>=2,<3",
]

[project.urls]
Homepage = "https://github.com/CarlossgLuz/Open-Vaultin"
Repository = "https://github.com/CarlossgLuz/Open-Vaultin"
Issues = "https://github.com/CarlossgLuz/Open-Vaultin/issues"
Documentation = "https://github.com/CarlossgLuz/Open-Vaultin/tree/main/docs"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8"]

[project.scripts]
vaultinctl = "vaultin.cli:app"
vaultinctl-hook = "vaultin.hooks.entrypoint:main"
vaultin-mcp = "vaultin.mcp.server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
