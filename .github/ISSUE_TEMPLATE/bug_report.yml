name: Bug report
description: Report a reproducible Vaultin problem
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Remove secrets, private repository names, personal paths and prompt content before submitting."
  - type: input
    id: version
    attributes:
      label: Vaultin version / commit
      placeholder: "0.1.0 / commit SHA"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows, Linux, Other]
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Minimal sanitized steps to reproduce.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: Output from vaultinctl doctor and relevant sanitized hook errors.
